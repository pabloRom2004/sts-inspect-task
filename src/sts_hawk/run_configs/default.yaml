task:
  task: sts_hawk/first_combat
  args:
    character: IRONCLAD
    ascension: 20
    prompt_name: first_combat
    setup_timeout: 900
    sandbox_image: ubuntu:24.04
    command_timeout: 180

solver:
  solver: sts_hawk/visual_agent
  args:
    max_screenshots: null
    tool_timeout: 180
    compaction_threshold: 787500

generate_config:
  max_tokens: 128000
  reasoning_effort: max
  max_connections: 1
  parallel_tool_calls: false
  temperature: null
  seed: null

eval_config:
  epochs: 1
  token_limit: null
  message_limit: null
  time_limit: null
