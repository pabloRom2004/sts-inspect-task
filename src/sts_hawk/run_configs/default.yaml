task:
  task: sts_hawk/first_combat
  args:
    character: IRONCLAD
    ascension: 20
    game_seed: '1'
    prompt_name: first_combat
    setup_timeout: 900
    sandbox_image: ubuntu:24.04
    command_timeout: 180

solver:
  solver: sts_hawk/visual_agent
  args:
    harness: react
    wiki_path: /opt/sts/wiki.md
    max_screenshots: 3
    tool_timeout: 180
    compaction_threshold: 787500
    codex:
      version: 0.169.0
      model_config: gpt-6-luna
      context_window: 272000
      compaction_threshold: 193800
      cwd: /workspace
      home_dir: /opt/sts/codex-home

generate_config:
  max_tokens: 128000
  reasoning_effort: max
  max_connections: 1
  parallel_tool_calls: false
  temperature: null
  seed: null

eval_config:
  epochs: 1
  token_limit: null
  message_limit: null
  time_limit: null

sts2:
  ascension: 10
  prompt_name: beat_game_sts2
  desktop_height: 800
  frame_rate_limit: 60

runtime_probe:
  wait_seconds: 15

manual_session:
  port: 6080
  session_seconds: 7200
