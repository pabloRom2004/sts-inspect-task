services:
  default:
    image: ubuntu:24.04
    platform: linux/amd64
    command: [sleep, infinity]
    environment:
      DISPLAY_NUM: '99'
      WIDTH: '1280'
      HEIGHT: '720'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
x-inspect_k8s_sandbox:
  allow_entities: [world]
  allow_domains:
    - '*'
