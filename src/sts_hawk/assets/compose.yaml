services:
  default:
    image: ubuntu:24.04
    platform: linux/amd64
    command:
      - bash
      - -lc
      - while [ ! -f /tmp/sts-runtime-ready ]; do sleep 1; done; exec bash /opt/sts/start.sh
    environment:
      DISPLAY_NUM: '99'
      WIDTH: '1280'
      HEIGHT: '720'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

x-inspect_k8s_sandbox:
  allow_entities: [world]
  allow_domains:
    - '*'
