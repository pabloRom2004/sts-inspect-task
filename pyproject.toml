[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sts-hawk-smoke"
version = "0.2.9"
requires-python = ">=3.12"
dependencies = ["inspect-ai>=0.3.286.dev10,<0.4", "openai>=3.3.1,<4", "PyYAML>=6", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "inspect-k8s-sandbox==0.14.0", "ruamel.yaml"]

[project.entry-points.inspect_ai]
sts_hawk = "sts_hawk._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/sts_hawk"]

[tool.ruff]
exclude = ["src/sts_hawk/assets/computer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
